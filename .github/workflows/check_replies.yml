name: 2. Check Reply & Auto-Evaluate (11 AM, 3 PM, 7 PM, 11 PM IST)

on:
  schedule:
    - cron: '30 5,9,13,17 * * *' # 11:00 AM, 03:00 PM, 07:00 PM, 11:00 PM IST
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: 'Target Pipeline (Select "all" or specific student)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mppsc_default
          - ctet_swati

jobs:
  evaluate-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1" # Do not write .pyc cache files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Minimal git history to save storage
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: '' # Disable pip caching to avoid consuming GitHub storage
      - name: Install dependencies (No-Cache)
        run: pip install --no-cache-dir -r requirements.txt
      - name: Evaluate Replies & Track Absent Tests
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINES_JSON: ${{ secrets.PIPELINES_JSON || vars.PIPELINES_JSON }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || vars.GROQ_MODEL }}
        run: |
          PIPELINE="${{ inputs.pipeline_id }}"
          if [ -n "$PIPELINE" ] && [ "$PIPELINE" != "all" ]; then
            python -B email_evaluator.py --pipeline "$PIPELINE"
          else
            python -B email_evaluator.py
          fi
      - name: Upload Separate Pipeline Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-evaluator-pipeline-logs
          path: logs/
          if-no-files-found: ignore