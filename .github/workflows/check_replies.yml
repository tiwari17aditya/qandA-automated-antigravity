name: 2. Check Reply & Auto-Evaluate (Every 8 Hours)

on:
  schedule:
    - cron: '30 2,10,18 * * *' # 08:00 AM, 04:00 PM, 12:00 AM IST
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: 'Target Pipeline (Select "all" or specific student)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mppsc_default
          - ctet_swati

jobs:
  evaluate-quiz:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1" # Do not write .pyc cache files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Minimal git history to save storage
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: '' # Disable pip caching to avoid consuming GitHub storage
      - name: Install dependencies (No-Cache)
        run: pip install --no-cache-dir -r requirements.txt
      - name: Evaluate Replies & Track Absent Tests
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINES_JSON: ${{ secrets.PIPELINES_JSON || vars.PIPELINES_JSON }}
        run: |
          if [ "${{ inputs.pipeline_id }}" != "" ] && [ "${{ inputs.pipeline_id }}" != "all" ]; then
            python -B email_evaluator.py --pipeline ${{ inputs.pipeline_id }}
          else
            python -B email_evaluator.py
          fi