name: 1. Send Daily MPPSC Quiz

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC = 08:00 AM IST
  workflow_dispatch:

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate & Send Quiz
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOPICS: ${{ secrets.TOPICS || vars.TOPICS }}
          QUESTIONS_PER_TOPIC: ${{ secrets.QUESTIONS_PER_TOPIC || vars.QUESTIONS_PER_TOPIC }}
        run: python daily_quiz_sender.py