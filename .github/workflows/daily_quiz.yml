name: 1. Send Daily Quiz

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC = 08:00 AM IST
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: 'Target Pipeline (Select "all" or specific student)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mppsc_default
          - ctet_swati

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1" # Do not write .pyc cache files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Minimal git history to save storage
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: '' # Disable pip caching to avoid consuming GitHub storage
      - name: Install dependencies (No-Cache)
        run: pip install --no-cache-dir -r requirements.txt
      - name: Generate & Send Quiz
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || vars.LLM_PROVIDER }}
          TOPICS: ${{ secrets.TOPICS || vars.TOPICS }}
          QUESTIONS_PER_TOPIC: ${{ secrets.QUESTIONS_PER_TOPIC || vars.QUESTIONS_PER_TOPIC }}
          PIPELINES_JSON: ${{ secrets.PIPELINES_JSON || vars.PIPELINES_JSON }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || vars.GROQ_MODEL }}
        run: |
          if [ "${{ inputs.pipeline_id }}" != "" ] && [ "${{ inputs.pipeline_id }}" != "all" ]; then
            python -B daily_quiz_sender.py --pipeline ${{ inputs.pipeline_id }}
          else
            python -B daily_quiz_sender.py
          fi
      - name: Upload Separate Pipeline Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-pipeline-logs
          path: logs/
          if-no-files-found: ignore