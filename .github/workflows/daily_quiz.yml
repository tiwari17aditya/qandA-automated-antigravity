name: 1. Send Daily MPPSC Quiz

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC = 08:00 AM IST
  workflow_dispatch:

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1" # Do not write .pyc cache files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Minimal git history to save storage
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: '' # Disable pip caching to avoid consuming GitHub storage
      - name: Install dependencies (No-Cache)
        run: pip install --no-cache-dir -r requirements.txt
      - name: Generate & Send Quiz
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOPICS: ${{ secrets.TOPICS || vars.TOPICS }}
          QUESTIONS_PER_TOPIC: ${{ secrets.QUESTIONS_PER_TOPIC || vars.QUESTIONS_PER_TOPIC }}
          TOTAL_QUESTIONS: ${{ secrets.TOTAL_QUESTIONS || vars.TOTAL_QUESTIONS }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
        run: python -B daily_quiz_sender.py